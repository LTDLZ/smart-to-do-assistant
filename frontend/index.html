<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tasks | Smart To-Do Assistant</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="page-width">Smart To-Do Assistant</div>
    </header>

    <main class="page-width">
      <h1>Tasks</h1>
      <article class="task-card" aria-labelledby="task-title">
        <header class="task-heading">
          <h2 id="task-title">Buy groceries</h2>
          <span class="task-status">In Progress</span>
        </header>
        <p class="task-description">Weekly grocery run for the apartment</p>

        <dl class="task-details">
          <div>
            <dt>Due date</dt>
            <dd><time datetime="2026-11-18">Nov 18, 2026</time></dd>
          </div>
          <div>
            <dt>Estimated time</dt>
            <dd>60 min</dd>
          </div>
          <div>
            <dt>Urgency</dt>
            <dd>5 / 5</dd>
          </div>
          <div>
            <dt>Importance</dt>
            <dd>2 / 5</dd>
          </div>
        </dl>
      </article>
    </main>
  </body>
</html>
