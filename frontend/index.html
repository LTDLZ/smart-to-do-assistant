<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tasks | Smart To-Do Assistant</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="page-width">Smart To-Do Assistant</div>
    </header>

    <main class="page-width">
      <h1>Tasks</h1>
      <div class="task-list" id="task-list"></div>
      <noscript>Enable JavaScript to view the task list.</noscript>

      <template id="task-card-template">
        <details class="task-card" name="tasks">
          <summary class="task-heading">
            <span class="task-title" data-field="title"></span>
            <span class="urgency-dot"></span>
            <span class="task-toggle" aria-hidden="true"></span>
          </summary>
          <div class="task-body">
            <div class="task-overview">
              <span class="task-status" data-field="status"></span>
              <p class="task-description" data-field="description"></p>
            </div>
            <dl class="task-details">
              <div>
                <dt>Due date</dt>
                <dd data-field="due"></dd>
              </div>
              <div>
                <dt>Estimated time</dt>
                <dd data-field="duration"></dd>
              </div>
              <div>
                <dt>Urgency</dt>
                <dd class="task-rating" data-field="urgency"></dd>
              </div>
              <div>
                <dt>Importance</dt>
                <dd class="task-rating" data-field="importance"></dd>
              </div>
            </dl>
          </div>
        </details>
      </template>
    </main>
    <script src="taskApi.js" defer></script>
    <script src="app.js" defer></script>
  </body>
</html>
